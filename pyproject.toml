[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervals-gateway"
version = "0.1.0"
description = "intervals.icu gateway MCP — write workouts / schedule events / read fitness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
intervals-gateway = "intervals_gateway.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_gateway"]
