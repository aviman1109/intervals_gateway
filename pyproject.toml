[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intervals-gateway"
version = "0.1.0"
description = "intervals.icu gateway MCP — write workouts / schedule events / read fitness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 上限必要：mcp 2.0.0 移除了 mcp.server.fastmcp（改 mcp.server.mcpserver），
    # 沒有上限的話下次 rebuild 會拉到 2.x 直接 ImportError 起不來。
    # 升 2.x 要連同 FastMCP / TransportSecuritySettings 的 import 一起改寫。
    "mcp>=1.23.0,<2",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
]

[project.scripts]
intervals-gateway = "intervals_gateway.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_gateway"]
